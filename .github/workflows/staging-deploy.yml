name: Staging Deploy

on:
  workflow_dispatch:
    inputs:
      frontend_sha:
        description: SHA cua repo frontend can deploy (de trong = dau branch dev hien tai)
        required: false
        type: string
      backend_sha:
        description: SHA cua repo backend can ghi status staging
        required: false
        type: string

permissions:
  contents: read
  statuses: write

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  frontend:
    name: Deploy frontend to Vercel
    # Repo FE dispatch sang day sau khi job Build xanh (workflow_dispatch
    # khong phat sinh workflow_run, nen day la diem noi duy nhat).
    if: github.event.inputs.frontend_sha != '' || github.event.inputs.backend_sha == ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Resolve frontend commit
        id: sha
        run: |
          if [ -n "${{ github.event.inputs.frontend_sha }}" ]; then
            echo "value=${{ github.event.inputs.frontend_sha }}" >> "$GITHUB_OUTPUT"
          else
            git ls-remote https://github.com/PNV-do-an/AI-Interview-Platform-FE dev | awk '{print "value="$1}' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          repository: PNV-do-an/AI-Interview-Platform-FE
          ref: ${{ steps.sha.outputs.value }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull production environment
        run: npx --yes vercel@64.3.1 pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: Build
        run: npx --yes vercel@64.3.1 build --prod --token "$VERCEL_TOKEN"

      - name: Deploy to production alias
        run: npx --yes vercel@64.3.1 deploy --prebuilt --prod --token "$VERCEL_TOKEN"

      - name: Verify live site
        run: |
          sleep 5
          curl -fsS https://aiinterview-vn.vercel.app -o /dev/null
          echo "frontend dev -> ${{ steps.sha.outputs.value }} da live"

  backend:
    name: Record backend staging
    # Render moi la noi build + deploy backend (gate checksPass tren commit dev
    # cua repo BE). Job nay chi ghi ket qua ve day de theo doi mot cho.
    if: github.event.inputs.backend_sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe Render and publish status
        uses: actions/github-script@v7
        env:
          BACKEND_SHA: ${{ github.event.inputs.backend_sha }}
        with:
          script: |
            const sha = process.env.BACKEND_SHA;
            const probe = async () => {
              try {
                const r = await fetch('https://ai-interview-backend-staging.onrender.com/api/v1/packages',
                                      { signal: AbortSignal.timeout(30000) });
                return r.status;
              } catch (e) { return 'err:' + e.name; }
            };
            let code = await probe();
            for (let i = 0; i < 6 && code !== 200; i++) {
              await new Promise(r => setTimeout(r, 30000));
              code = await probe();
            }
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: code === 200 ? 'success' : 'failure',
              context: 'backend / staging',
              description: `BE ${sha.slice(0, 7)} Render /api/v1/packages = ${code}`,
              target_url: `https://github.com/PNV-do-an/AI-Interview-Platform-BE/commit/${sha}`,
            });
            core.info(`backend ${sha} -> Render ${code}`);
