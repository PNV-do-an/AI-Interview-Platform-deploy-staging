name: Staging Deploy

on:
  workflow_run:
    workflows: ["Frontend CI"]
    types: [completed]
    branches: [dev]
  workflow_dispatch:
    inputs:
      frontend_sha:
        description: SHA cua repo frontend can deploy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  frontend:
    name: Deploy frontend to Vercel
    # workflow_run chi chay khi CI xanh; that bai thi de nguyen ban dang tri
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Resolve frontend commit
        id: sha
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.frontend_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          repository: PNV-do-an/AI-Interview-Platform-FE
          ref: ${{ steps.sha.outputs.value }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull production environment
        run: npx --yes vercel@64.3.1 pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: Build
        run: npx --yes vercel@64.3.1 build --prod --token "$VERCEL_TOKEN"

      - name: Deploy to production alias
        run: npx --yes vercel@64.3.1 deploy --prebuilt --prod --token "$VERCEL_TOKEN"

      - name: Verify live site
        run: |
          sleep 5
          curl -fsS https://aiinterview-vn.vercel.app -o /dev/null
          echo "frontend dev -> ${{ steps.sha.outputs.value }} da live"
