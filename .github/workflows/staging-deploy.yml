name: Staging Deploy

on:
  workflow_run:
    workflows: ["Frontend CI", "Staging CI"]
    types: [completed]
    branches: [dev]
  workflow_dispatch:
    inputs:
      frontend_sha:
        description: SHA cua repo frontend can deploy (de trong = lan CI xanh gan nhat)
        required: false
        type: string

permissions:
  contents: read
  statuses: write

concurrency:
  group: staging-deploy-${{ github.event.workflow_run.name || 'manual' }}
  cancel-in-progress: false

jobs:
  frontend:
    name: Deploy frontend to Vercel
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.name == 'Frontend CI' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Resolve frontend commit
        id: sha
        run: |
          if [ -n "${{ inputs.frontend_sha }}" ]; then
            echo "value=${{ inputs.frontend_sha }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.workflow_run.head_sha }}" ]; then
            echo "value=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            git ls-remote https://github.com/PNV-do-an/AI-Interview-Platform-FE dev | awk '{print "value="$1}' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          repository: PNV-do-an/AI-Interview-Platform-FE
          ref: ${{ steps.sha.outputs.value }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull production environment
        run: npx --yes vercel@64.3.1 pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: Build
        run: npx --yes vercel@64.3.1 build --prod --token "$VERCEL_TOKEN"

      - name: Deploy to production alias
        run: npx --yes vercel@64.3.1 deploy --prebuilt --prod --token "$VERCEL_TOKEN"

      - name: Verify live site
        run: |
          sleep 5
          curl -fsS https://aiinterview-vn.vercel.app -o /dev/null
          echo "frontend dev -> ${{ steps.sha.outputs.value }} da live"

  backend:
    name: Record backend staging
    # Render moi la noi build + deploy backend (checksPass tren repo BE).
    # Job nay ghi ket qua CI ve branch mac dinh cua repo nay de mot cho theo doi.
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.name == 'Staging CI'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe Render and publish status
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const probe = async () => {
              try {
                const r = await fetch('https://ai-interview-backend-staging.onrender.com/api/v1/packages',
                                      { signal: AbortSignal.timeout(30000) });
                return r.status;
              } catch (e) { return 'err:' + e.name; }
            };
            let code = await probe();
            for (let i = 0; i < 6 && code !== 200; i++) {
              await new Promise(r => setTimeout(r, 30000));
              code = await probe();
            }
            const ok = run.conclusion === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: ok ? 'success' : 'failure',
              context: 'backend / staging',
              description: `${run.head_sha.slice(0, 7)} Render: ${code}`,
              target_url: run.html_url,
            });
            core.info(`backend ${run.head_sha} -> CI ${run.conclusion}, Render /api/v1/packages = ${code}`);
