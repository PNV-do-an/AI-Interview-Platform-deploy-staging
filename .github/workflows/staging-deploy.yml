name: Staging Deploy

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      force:
        description: Chay ca 2 job bat ke commit co doi submodule hay khong
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  detect:
    name: Detect changed submodules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.diff.outputs.frontend }}
      backend: ${{ steps.diff.outputs.backend }}
    steps:
      - uses: actions/checkout@v4

      - name: Compare with previous commit
        id: diff
        run: |
          base=$(git rev-parse HEAD^ 2>/dev/null || echo "")
          if [ -z "$base" ]; then
            changed=""
          else
            changed=$(git diff --name-only "$base" HEAD)
          fi
          echo "changed paths:"; echo "$changed" | sed 's/^/  /'
          fe=false; be=false
          echo "$changed" | grep -qx 'frontend' && fe=true
          echo "$changed" | grep -qx 'backend' && be=true
          if [ "${{ inputs.force }}" = "true" ]; then fe=true; be=true; fi
          echo "frontend=$fe" >> "$GITHUB_OUTPUT"
          echo "backend=$be" >> "$GITHUB_OUTPUT"

  frontend:
    name: Deploy frontend to Vercel
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Show pinned commit
        working-directory: ${{ github.workspace }}
        run: git -C frontend log --oneline -1

      - name: Install dependencies
        run: npm ci

      - name: Pull production environment
        run: npx --yes vercel@64.3.1 pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: Build
        run: npx --yes vercel@64.3.1 build --prod --token "$VERCEL_TOKEN"

      - name: Deploy to production alias
        run: npx --yes vercel@64.3.1 deploy --prebuilt --prod --token "$VERCEL_TOKEN"

      - name: Verify live site
        run: |
          sleep 5
          curl -fsS https://aiinterview-vn.vercel.app -o /dev/null
          echo "frontend da live"

  backend:
    name: Deploy backend on Render
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show pinned commit
        run: git -C backend log --oneline -1

      - name: Trigger Render deploy hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "Thieu secret RENDER_DEPLOY_HOOK_URL"; exit 1
          fi
          code=$(curl -sS -o /tmp/render.json -w '%{http_code}' -X POST "$HOOK")
          echo "render hook HTTP $code"
          [ "$code" = "200" ] || [ "$code" = "202" ] || { cat /tmp/render.json; exit 1; }

      - name: Wait for service to come back
        run: |
          url=https://ai-interview-backend-staging.onrender.com/api/v1/packages
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$url" || echo 000)
            echo "attempt $i -> $code"
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          echo "backend khong health sau ~10 phut"; exit 1
