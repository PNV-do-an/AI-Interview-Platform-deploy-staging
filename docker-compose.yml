services:
  # ── MySQL database ────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: ai_interview_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-ai_interview_db}
      MYSQL_USER: ${DB_APP_USERNAME:-aiuser}
      MYSQL_PASSWORD: ${DB_APP_PASSWORD:-aipassword}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - ai_interview_network

  # ── Backend (Spring Boot) ─────────────────────────────────────────────────
  # `backend` va `frontend` la submodule cua superrepo nay.
  # Sau khi clone: git submodule update --init --recursive
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_interview_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-ai_interview_db}
      DB_USERNAME: ${DB_USERNAME:-aiuser}
      DB_PASSWORD: ${DB_PASSWORD:-aipassword}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-noreply@aiinterview.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-true}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      SSO_OIDC_ISSUER: ${SSO_OIDC_ISSUER:-}
      SSO_OIDC_BASE_URL: ${SSO_OIDC_BASE_URL:-}
      SSO_CLIENT_ID: ${SSO_CLIENT_ID:-}
      SSO_CLIENT_SECRET: ${SSO_CLIENT_SECRET:-}
      SSO_ALLOWED_EMAIL_DOMAINS: ${SSO_ALLOWED_EMAIL_DOMAINS:-}
      SSO_REDIRECT_URI: ${SSO_REDIRECT_URI:-http://localhost:3000/login}
    ports:
      - "8080:8080"
    networks:
      - ai_interview_network

  # ── Frontend (React + Nginx) ──────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai_interview_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - ai_interview_network

  # ── Keycloak (Identity Provider giả lập cho Enterprise SSO) ────────────────
  # Không chạy mặc định: docker compose --profile sso up -d
  keycloak:
    image: keycloak/keycloak:25.0
    container_name: ai_interview_keycloak
    profiles: ["sso"]
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${SSO_KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_HOSTNAME: http://localhost:${SSO_KEYCLOAK_PORT:-8180}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./keycloak/realm-ai-interview-dev.json:/opt/keycloak/data/import/realm.json:ro
    ports:
      - "8180:8080"
    networks:
      - ai_interview_network

networks:
  ai_interview_network:
    driver: bridge

volumes:
  mysql_data:
    name: ai_interview_compose_mysql_data